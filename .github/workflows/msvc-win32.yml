name: MSVC Win32 Build

on:
  push:
    branches:
      - main
      - build/msvc-x86
  pull_request:
    branches:
      - main
      - build/msvc-x86
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Visual Studio and vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not available on this runner."
          }
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure MSVC Win32
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload Win32 build
        uses: actions/upload-artifact@v4
        with:
          name: iRx-MSVC-Win32
          path: |
            build/out/iRx.exe
            build/out/*.dll
          if-no-files-found: error
